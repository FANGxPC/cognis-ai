<script src="../js/config.js"></script>

<script src="../js/ui.js"></script>

<script>
// ======================================================
// DYNAMIC SUCCESS — powered by backend API
// ======================================================

const sessionId = Session.getSessionId();
const rootCauseNode = Session.getRootCauseNode();
const matchedNode = Session.getMatchedNodeId();
const quizScore = Session.getQuizScore();
const totalQuestions = Session.getTotalQuestions();

const statusChip = document.getElementById("statusChip");
const heroTitle = document.getElementById("heroTitle");
const heroDescription = document.getElementById("heroDescription");
const statConcept = document.getElementById("statConcept");
const statQuestions = document.getElementById("statQuestions");
const statResult = document.getElementById("statResult");

async function verifyMastery() {
    // Show what we know from the session
    const conceptLabel = (rootCauseNode || matchedNode || "unknown").replace(/_/g, " ");
    statConcept.textContent = conceptLabel;
    statQuestions.textContent = `${quizScore}/${totalQuestions || "?"}`;

    if (!sessionId) {
        // No session — show static completion
        statusChip.textContent = "MISSION COMPLETE";
        heroTitle.innerHTML = "CONCEPT<br>MASTERED";
        heroDescription.textContent = "The diagnostic flow has been completed.";
        statResult.textContent = "DONE";
        return;
    }

    try {
        // Call the retest endpoint to verify mastery
        const result = await retest(sessionId, rootCauseNode);

        if (result.solved) {
            statusChip.textContent = "MISSION COMPLETE";
            heroTitle.innerHTML = "CONCEPT<br>MASTERED";
            heroDescription.textContent = "Congratulations! The diagnostic engine has verified your understanding. The root cause concept has been mastered.";
            statResult.textContent = "PASSED ✓";
            statResult.style.color = "#C5FF6B";
        } else {
            statusChip.textContent = "NEEDS REVIEW";
            heroTitle.innerHTML = "KEEP<br>LEARNING";
            heroDescription.textContent = "The retest indicates more practice is needed. Consider reviewing the remediation material again.";
            statResult.textContent = "REVIEW";
            statResult.style.color = "#FF5F6D";
        }

        // Show updated graph state if available
        if (result.updated_graph_state) {
            const mastered = Object.values(result.updated_graph_state).filter(v => v >= 1.0).length;
            const total = Object.keys(result.updated_graph_state).length;
            statQuestions.textContent = `${mastered}/${total} mastered`;
        }

    } catch (err) {
        console.error("Retest failed:", err);

        // Graceful fallback — show completion anyway
        statusChip.textContent = "MISSION COMPLETE";
        heroTitle.innerHTML = "CONCEPT<br>MASTERED";
        heroDescription.textContent = "The diagnostic flow has been completed. You can scan another concept or review your progress.";
        statResult.textContent = "DONE";
    }
}

verifyMastery();

if (window.lucide && typeof lucide.createIcons === "function") {
    lucide.createIcons();
}
</script>

<script src="../js/ui-polish.js"></script>
