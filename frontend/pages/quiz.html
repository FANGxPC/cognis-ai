<script>
// ======================================================
// DYNAMIC QUIZ — powered by backend API
// ======================================================

const title = document.querySelector(".hero-title");
const questionEl = document.querySelector("h2");
const progressEl = document.querySelector(".counter");
const buttonsContainer = document.querySelector(".grid.gap-5");
const nextBtn = document.getElementById("nextQuestion");
const chipEl = document.querySelector(".status-chip");

let selectedAnswer = -1;
let currentQuestionId = null;
let questionsAnswered = 0;
let score = 0;

// Traversal state from Session
const sessionId = Session.getSessionId();
const traversalPath = Session.getTraversalPath();
const totalNodes = traversalPath.length;

// Redirect if no active session
if (!sessionId || totalNodes === 0) {
    showToast("No active scan session. Please run a scan first.", "error");
    setTimeout(() => { window.location.href = "scan.html"; }, 1500);
}

// --------------------------------------------------
// Load a question for the current node
// --------------------------------------------------
async function loadQuestion() {
    const nodeId = Session.getCurrentNodeId();
    const nodeIdx = Session.getCurrentNodeIndex();

    if (!nodeId) {
        // All nodes probed — go to root cause
        Session.setQuizScore(score);
        window.location.href = "rootcause.html";
        return;
    }

    // Update header
    chipEl.textContent = `PROBING: ${nodeId.replace(/_/g, " ").toUpperCase()}`;
    title.innerHTML = `NODE<br>${String(nodeIdx + 1).padStart(2, "0")}`;
    progressEl.innerHTML = `${String(nodeIdx + 1).padStart(2, "0")}/${String(totalNodes).padStart(2, "0")}`;

    // Reset selection
    selectedAnswer = -1;
    currentQuestionId = null;
    nextBtn.disabled = true;
    nextBtn.style.opacity = ".5";

    try {
        const data = await nextQuestion(sessionId, nodeId);

        // Render question
        questionEl.textContent = data.prompt || data.question;
        currentQuestionId = data.question_id;

        // Render options dynamically
        const rawOptions = data.options || data.choices || [];
        const options = Array.isArray(rawOptions)
            ? rawOptions
            : (typeof rawOptions === "object" && rawOptions !== null)
                ? Object.values(rawOptions)
                : [];
        buttonsContainer.innerHTML = "";

        options.forEach((opt, index) => {
            const btn = document.createElement("button");
            btn.className = "secondary-button answer";
            btn.textContent = opt;
            btn.onclick = () => selectAnswer(index, btn);
            buttonsContainer.appendChild(btn);
        });

    } catch (err) {
        console.error("Failed to load question:", err);

        // If no questions remain for this node, auto-advance
        if (err.message && err.message.includes("No unasked questions")) {
            Session.advanceNode();
            await loadQuestion();
            return;
        }

        questionEl.textContent = "Failed to load question. Please try again.";
        showToast("Error loading question: " + err.message, "error");
    }
}

// --------------------------------------------------
// Handle answer selection
// --------------------------------------------------
function selectAnswer(index, clickedBtn) {
    selectedAnswer = index;

    // Reset all buttons
    buttonsContainer.querySelectorAll(".answer").forEach(btn => {
        btn.style.borderColor = "rgba(255,255,255,.08)";
        btn.style.background = "rgba(255,255,255,.03)";
    });

    // Highlight selected
    clickedBtn.style.borderColor = "#C5FF6B";
    clickedBtn.style.background = "rgba(197,255,107,.12)";

    // Enable next
    nextBtn.disabled = false;
    nextBtn.style.opacity = "1";
}

// --------------------------------------------------
// Submit answer and advance
// --------------------------------------------------
nextBtn.onclick = async () => {
    if (selectedAnswer === -1 || !currentQuestionId) return;

    nextBtn.disabled = true;
    nextBtn.textContent = "SUBMITTING...";

    try {
        const result = await submitAnswer(sessionId, currentQuestionId, selectedAnswer);

        questionsAnswered++;

        if (result.correct) {
            score++;
            showToast("✓ Correct!", "success");
        } else {
            showToast("✗ Incorrect", "error");
        }

        // Brief pause to show feedback
        await new Promise(r => setTimeout(r, 800));

        if (result.next_action === "root_confirmed") {
            // Root cause found — store and redirect
            Session.setQuizScore(score);
            Session.setTotalQuestions(questionsAnswered);
            window.location.href = "rootcause.html";
            return;
        }

        // Advance to next node in traversal
        Session.advanceNode();
        nextBtn.textContent = "NEXT →";
        await loadQuestion();

    } catch (err) {
        console.error("Submit failed:", err);
        showToast("Error submitting answer: " + err.message, "error");
        nextBtn.disabled = false;
        nextBtn.textContent = "NEXT →";
    }
};

// Start
loadQuestion();

if (window.lucide && typeof lucide.createIcons === "function") {
    lucide.createIcons();
}
</script>
